<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحّال | Rahhal - دليلك الشامل لمدن مصر التاريخية والسياحية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; direction: rtl; text-align: right; }
        
        /* شريط اللغات العلوي */
        .lang-bar { background-color: #1a1a1a; padding: 12px 20px; display: flex; justify-content: flex-start; gap: 10px; }
        .lang-btn { background-color: #333; color: white; border: 1px solid #555; padding: 6px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background-color: #ff5722; border-color: #ff5722; }

        /* البانر الرئيسي والصورة */
        .hero { position: relative; background: url('https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; padding: 40px 20px; }
        .hero::before { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.45); }
        .hero-content { position: relative; z-index: 1; max-width: 800px; }
        .hero h1 { font-size: 45px; margin-bottom: 12px; font-weight: bold; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); }
        .hero p { font-size: 18px; margin-bottom: 15px; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .welcome-tag { font-size: 22px; color: #ffeb3b; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }

        /* حاوية البحث والخدمات */
        .search-container { max-width: 600px; margin: -35px auto 30px auto; position: relative; z-index: 2; padding: 0 15px; }
        .search-box { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); text-align: center; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 14px 45px 14px 15px; border: 2px solid #003580; border-radius: 30px; font-size: 15px; text-align: right; outline: none; }
        .input-group .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #003580; }
        
        .btn-search-google { width: 100%; background-color: #003580; color: white; border: none; padding: 13px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; margin-bottom: 12px; transition: background 0.3s; }
        .btn-search-google:hover { background-color: #00224f; }

        .btn-booking-orange { width: 100%; background-color: #ff5722; color: white; border: none; padding: 15px; border-radius: 30px; font-size: 17px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 12px rgba(255,87,34,0.4); transition: background 0.3s; }
        .btn-booking-orange:hover { background-color: #e64a19; }

        footer { text-align: center; padding: 20px; color: #777; font-size: 13px; border-top: 1px solid #ddd; margin-top: 30px; }
    </style>
</head>
<body>

    <!-- شريط اللغات العلوي -->
    <div class="lang-bar">
        <a href="#" class="lang-btn active">العربية 🇸🇦</a>
        <a href="#" class="lang-btn">English 🇬🇧</a>
        <a href="#" class="lang-btn">Русский 🇷🇺</a>
    </div>

    <!-- البانر الرئيسي -->
    <div class="hero">
        <div class="hero-content">
            <h1>رحّال | Rahhal</h1>
            <p>دليلك الشامل لمدن مصر التاريخية والسياحية، الفنادق، وخدمات الطيران</p>
            <div class="welcome-tag">أهلاً بكم في مصر 🇪🇬</div>
        </div>
    </div>

    <!-- مربع البحث والخدمات -->
    <div class="search-container">
        <div class="search-box">
            <div class="input-group">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="ابحث عن مدينة أو معلم في الموقع، أو ابحث...">
            </div>
            
            <a href="#" class="btn-search-google">🌐 البحث عن معلومات سياحية في الموقع (Google)</a>
            <a href="#" class="btn-booking-orange">⚡ احجز فندقك الآن</a>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 موقع رحّال | Rahhal
    </footer>

</body>
</html>
